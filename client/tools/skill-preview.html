<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>战士四技能动画评审</title>
<style>
*{box-sizing:border-box}body{background:#101a22;color:#e2ebef;font:16px system-ui;max-width:1100px;padding:24px;margin:auto}h1{font-size:26px}p{color:#9db0bd;line-height:1.7}canvas{width:100%;background:#182934;border:1px solid #38505e;border-radius:12px;image-rendering:pixelated}button,select{font:inherit;color:inherit;background:#294252;border:1px solid #5b7c8e;padding:9px 13px;border-radius:7px;cursor:pointer;touch-action:none}.controls{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}output{display:block;min-height:30px;color:#86dfc6}a{color:#8ad9e5}
</style>
<h1>战士四技能 · 命中反馈</h1><p>30血耐打靶：僵直 / 击倒 / 起身 · 5秒流血红色心跳脉冲。拔刀斩保留单刀蓄力v2。<a href="/">返回普攻评审</a></p>
<canvas width="960" height="440" aria-label="战士四技能动画"></canvas>
<div class="controls"><button data-skill="cross">十字斩 E</button><button data-skill="bengshan">崩山击 F</button><button data-skill="badao">拔刀斩 Q</button><button data-skill="earth">崩山裂地斩 G</button><button id="attack">接一段普攻</button></div>
<div class="controls"><select id="speed" aria-label="播放速度"><option value="1">1× 正常速度</option><option value="0.25">0.25× 慢放</option></select><select id="zoom" aria-label="角色显示大小"><option value="1">游戏显示尺寸</option><option value="2" selected>2× 放大检查</option></select><button id="pause">暂停</button><button id="step">前进 10ms</button><button id="step100">前进100ms</button><button id="face">转身</button><button id="interrupt">模拟受击打断</button><button id="reset">重置</button></div>
<output id="status">加载图集…</output><output id="target-status">靶怪状态</output><p>每次点击技能从头播放并恢复蓝量/CD，靶怪归位但保留受击和流血状态，可连续命中检查刷新5秒。重置清除全部状态。按 ←/→ 可在后摇开放后走开，观察地面残留。大崩喷发不追加伤害。</p><p>与游戏共用敌人、命中、技能时序和效果寿命模型；Canvas特效为示意。流血本轮先展示红色脉冲，是否持续扣血已确认，数值与伤害接入待完成。实际战斗和手机触控需Cocos构建复评。</p>
<script type="module">
import { CombatModel } from '/CombatModel.js';
import { basicAttacks, attackAtlas, attackFrame } from '/WarriorAttackAnimation.js';
import { skillAnimations, skillAtlas, skillFrame } from '/WarriorSkillAnimation.js';
import { WarriorSkillsModel, warriorSkillNames, warriorSkillTuning, applyWarriorSkillHit } from '/WarriorSkillsModel.js';
import { WarriorSkillEffects } from '/WarriorSkillEffects.js';
import { EnemyModel } from '/EnemyModel.js';
const model=new CombatModel(),skills=new WarriorSkillsModel(),effects=new WarriorSkillEffects();
let target=new EnemyModel(45,0,0,30);
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),images={};
async function load(name,url){const im=new Image();im.src=url;await im.decode();images[name]=im;}
await Promise.all([load('attack','/atlas.png'),...Object.keys(skillAnimations).map(id=>load(id,'/'+skillAnimations[id].resource+'.png'))]);
let paused=false,facing=1,accumulator=0,previous=performance.now(),travel=0,hits=0,axis=0;
const state={model,skills,effects,ready:true,frame:0,speed:1,zoom:2,tick,cast};window.skillPreview=state;
function cast(id){model.reset();skills.reset();travel=0;hits=0;if(target.state==='dead')target=new EnemyModel(45,0,0,30);target.x=facing*45;target.y=0;skills.cast(id,facing);draw();}
function tick(dt){accumulator+=dt;while(accumulator>=1/120){
 target.update(1/120,model,true);
 effects.update(1/120);skills.update(1/120);
 if(skills.casting&&skills.canMove&&axis)skills.cancel();
 travel+=skills.motionDelta;
 if(skills.lastImpact){effects.impact(skills.lastImpact,travel,0,skills.facing);if(applyWarriorSkillHit(skills.lastImpact,target,travel,0,skills.facing))hits++;}
 const priorContact=model.impactId;model.update(1/120,0,0);
 if(model.impactId!==priorContact&&target.state!=='dead'&&Math.abs(target.x-travel)<=52&&(target.x-travel)*facing>=-8&&Math.abs(target.y)<=23){target.hit(travel);hits++;}
 if(!skills.casting)travel=Math.max(-160,Math.min(160,travel+axis*100/120));
 accumulator-=1/120;
 }draw();}
function effectArt(e){
 const fade=1-e.age/e.lifetime,r=warriorSkillTuning[e.id].range;
 ctx.save();ctx.translate(e.x*2,0);ctx.scale(e.facing,1);ctx.globalAlpha=fade;ctx.strokeStyle=e.id==='earth'?'#ff9a62':'#b8f0ff';ctx.lineWidth=3;
 if(e.id==='cross'){const x=58+e.age/e.lifetime*24;ctx.beginPath();ctx.moveTo(x-43,-44);ctx.lineTo(x+43,-44);ctx.moveTo(x,-88);ctx.lineTo(x,0);ctx.stroke();}
 else if(e.id==='badao'){ctx.lineWidth=6;ctx.beginPath();ctx.ellipse(0,-44,(85+Math.min(1,e.age/.1)*57)*2,68,0,-Math.PI/2,Math.PI/2);ctx.stroke();}
 else{const grow=Math.min(1,e.age/(e.id==='earth'?.18:.16));ctx.beginPath();ctx.ellipse(0,0,r*2*grow,r*2*grow,0,0,Math.PI*2);ctx.stroke();
  for(let i=0;i<9;i++){const a=i*2.39996;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*r*grow*1.4,Math.sin(a)*r*grow*1.4);ctx.stroke();}
  if(e.id==='earth'&&e.age>=.4&&e.age<1.12){const pulse=Math.sin((e.age-.4)/.72*Math.PI);ctx.globalAlpha=pulse*.45;ctx.fillStyle='#ffb365';for(let i=0;i<9;i++){const a=i*2.39996,x=Math.cos(a)*r*1.36,y=Math.sin(a)*r*1.1,h=(52+i%3*18)*pulse;ctx.beginPath();ctx.moveTo(x-10,y);ctx.lineTo(x+4,y-h);ctx.lineTo(x+12,y);ctx.fill();}}
 }ctx.restore();
}
function targetArt(){
 if(target.state==='dead')return;
 ctx.save();ctx.translate(target.x*2,-target.y*2);ctx.fillStyle='#0d191e';ctx.beginPath();ctx.ellipse(0,0,24,8,0,0,Math.PI*2);ctx.fill();
 ctx.save();ctx.translate(0,-8);ctx.rotate(Math.PI/2*target.downPose*target.fallDirection);ctx.translate(0,8);
 const p=target.bleedPulse;
 const tint=(r,g,b)=>target.flash>0?'#f5ddd0':`rgb(${Math.round(r+(235-r)*p*.65)},${Math.round(g*(1-p*.52))},${Math.round(b*(1-p*.455))})`;
 if(p>0){ctx.fillStyle=`rgba(244,45,62,${p*.3})`;ctx.fillRect(-15,-35,30,34);ctx.fillRect(-13,-51,26,24);}
 ctx.fillStyle=tint(128,99,72);ctx.fillRect(-12,-32,24,28);ctx.fillStyle=tint(187,137,96);ctx.fillRect(-10,-48,20,18);ctx.fillStyle=tint(68,61,55);ctx.fillRect(-12,-50,24,8);ctx.fillStyle='#251f1b';ctx.fillRect(-7,-38,4,4);ctx.restore();
 ctx.fillStyle='#10181b';ctx.fillRect(-23,-62,46,6);ctx.fillStyle='#ff967c';ctx.fillRect(-22,-61,44*target.hp/target.maxHp,4);ctx.restore();
}
function draw(){
 const id=skills.activeId;let key=id||'cross',frame=0,atlas=skillAtlas;
 if(id)frame=skillFrame(id,skills.elapsed);else if(model.stage>=0){key='attack';frame=attackFrame(model.stage,model.elapsed);atlas=attackAtlas;}
 state.frame=frame;const im=images[key],w=im.width/atlas.columns,h=im.height/atlas.rows;
 ctx.clearRect(0,0,960,440);ctx.save();ctx.translate(480,330);ctx.scale(state.zoom,state.zoom);
 ctx.strokeStyle='#456172';ctx.beginPath();ctx.moveTo(-500,0);ctx.lineTo(500,0);ctx.stroke();
 for(const effect of effects.items)effectArt(effect);
 targetArt();
 ctx.fillStyle='#0d191e';ctx.beginPath();ctx.ellipse(travel*2,0,28,9.6,0,0,Math.PI*2);ctx.fill();
 if(id==='cross'&&skills.elapsed>=.17&&skills.elapsed<.29){ctx.strokeStyle='#b8f0ff';ctx.beginPath();ctx.moveTo(travel*2+facing*15,-44);ctx.lineTo(travel*2+facing*101,-44);ctx.stroke();}
 ctx.translate(travel*2,-skills.jumpLift*2);ctx.scale(facing,1);ctx.imageSmoothingEnabled=false;
 const size=(atlas===attackAtlas?58:skillAtlas.displaySize)*2.4;
 ctx.drawImage(im,frame%atlas.columns*w,Math.floor(frame/atlas.columns)*h,w,h,-size/2,-size*(1-atlas.anchorY),size,size);ctx.restore();
 const charge=id==='badao'&&skills.elapsed>=skillAnimations.badao.chargeStart&&skills.elapsed<skillAnimations.badao.chargeEnd;
 document.querySelector('#status').textContent=`${id?warriorSkillNames[id]:model.stage<0?'待机':basicAttacks[model.stage].name}${charge?' · 收腰蓄力':''} · 帧 ${frame+1} · ${Math.round((id?skills.elapsed:model.elapsed)*1000)}ms · 命中 ${hits} · 残留 ${effects.items.length} · 高度 ${skills.jumpLift.toFixed(1)}`;
 const states={approach:'站立',stunned:'僵直',knockedDown:'倒地',gettingUp:'起身',dead:'死亡',telegraph:'预警',attack:'攻击',recover:'恢复'};
 document.querySelector('#target-status').textContent=`靶怪 ${target.hp}/${target.maxHp} · ${states[target.state]} ${target.timer>0?target.timer.toFixed(2)+'s':''} · 流血 ${target.bleedLeft.toFixed(2)}s · 红色脉冲 ${target.bleedPulse.toFixed(2)}`;
}
document.querySelectorAll('[data-skill]').forEach(button=>button.onclick=()=>cast(button.dataset.skill));
document.querySelector('#attack').onclick=()=>{if(!skills.casting){model.press();model.release();}};
document.querySelector('#reset').onclick=()=>{model.reset();skills.reset();effects.clear();target=new EnemyModel(facing*45,0,0,30);travel=hits=accumulator=0;draw();};
document.querySelector('#interrupt').onclick=()=>{skills.cancel();model.takeHit(1);draw();};
document.querySelector('#speed').onchange=e=>state.speed=Number(e.target.value);
document.querySelector('#zoom').onchange=e=>{state.zoom=Number(e.target.value);draw();};
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'继续':'暂停';};
document.querySelector('#step').onclick=()=>{paused=true;document.querySelector('#pause').textContent='继续';tick(.01);};
document.querySelector('#step100').onclick=()=>{paused=true;document.querySelector('#pause').textContent='继续';tick(.1);};
document.querySelector('#face').onclick=()=>{if(!skills.casting){facing*=-1;draw();}};
window.onkeydown=e=>{if(e.repeat)return;const id={KeyE:'cross',KeyF:'bengshan',KeyQ:'badao',KeyG:'earth'}[e.code];if(id)cast(id);if(e.code==='ArrowLeft')axis=-1;if(e.code==='ArrowRight')axis=1;};
window.onkeyup=e=>{if(e.code.startsWith('Arrow'))axis=0;};window.onblur=()=>axis=0;
function animate(now){const dt=Math.min(.05,(now-previous)/1000);previous=now;if(!paused)tick(dt*state.speed);requestAnimationFrame(animate);}draw();requestAnimationFrame(animate);
</script></html>
