<style>
:root{color-scheme:dark;font:15px/1.6 system-ui;background:#101719;color:#e5e9e1}*{box-sizing:border-box}body{max-width:1120px;margin:auto;padding:28px}h1{font-size:28px;margin:0 0 8px}h2{font-size:19px;margin:0}p{color:#acbdb8;margin:6px 0 18px}button,select,input{font:inherit}button,select{border:1px solid #4e685e;background:#203730;color:#e7eedf;border-radius:7px;padding:7px 13px}button{cursor:pointer}button:hover{background:#355448}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:22px 0}label{display:flex;align-items:center;gap:7px}.proof{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.proof figure{margin:0}.proof figcaption{font-size:13px;color:#b6cdbb}.proof canvas{width:100%}@media(max-width:720px){.proof{grid-template-columns:repeat(2,1fr)}}.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px}article{background:#1a2325;border:1px solid #364846;border-radius:12px;overflow:hidden}header{padding:16px 20px 0}canvas{display:block;width:100%;height:auto;image-rendering:pixelated;background:repeating-conic-gradient(#192124 0% 25%,#1e282b 0% 50%) 0 0/24px 24px}.info{padding:14px 20px}.phase{font-variant-numeric:tabular-nums;color:#e6ca8e;min-height:28px}.frames{width:100%}a{color:#a6d7bb}footer{margin-top:22px;color:#9aafaa}.note{font-size:13px}.links{display:flex;gap:15px;flex-wrap:wrap}#error{color:#ffb9a9;white-space:pre-wrap}@media(max-width:720px){body{padding:18px}.cards{grid-template-columns:1fr}}

<h1>女性猎人 · 跑动 / 普攻 v4</h1><p>短战靴 · 黑丝袜 · 青绿轻甲。正常速度、慢放和逐帧检查；当前是美术动作草稿，尚未接入游戏。v4重画低抬膝经过姿势，按截图修订末帧腿环；v3保留作问题对照。</p>
<div class="controls"><button id="play">暂停</button><button id="reset">从头播放</button><label>版本<select id="variant"><option value="v4">v4 修订版</option><option value="v3">v3 问题对照</option></select></label><label>速度<select id="speed"><option value="1">1×</option><option value="0.5">0.5×</option><option value="0.25">0.25×</option></select></label><label>放大<select id="zoom"><option value="1">1×</option><option value="1.5">1.5×</option></select></label><label><input type="checkbox" id="arrow" checked>独立箭矢示意</label></div>
<div class="controls"><button id="contact-near">近腿接触位</button><button id="contact-far">远腿接触位</button><span class="note">切换版本可在同一帧对照后脚高度和腿环归属。</span></div><div class="cards"><article><header><h2>跑动循环</h2><span class="note">检查低抬膝经过姿势与末帧腿环连续性。</span></header><canvas id="run" width="416" height="416"></canvas><div class="info"><div class="phase" id="run-phase"></div><input class="frames" id="run-frame" type="range" min="0" max="7" value="0" aria-label="跑动逐帧"><div class="links"><a href="run-preview.gif">正常 GIF</a><a href="run-slow.gif">慢放 GIF</a></div></div></article>
<article><header><h2>单箭普攻</h2><span class="note">箭矢在松弦阶段独立生成；此处不计算碰撞。</span></header><canvas id="attack" width="416" height="416"></canvas><div class="info"><div class="phase" id="attack-phase"></div><input class="frames" id="attack-frame" type="range" min="0" max="7" value="0" aria-label="普攻逐帧"><div class="links"><a href="attack-preview.gif">正常 GIF</a><a href="attack-slow.gif">慢放 GIF</a></div></div></article></div>
<h2 style="margin-top:24px">同尺度接触位对照（截取腿部）</h2><div class="proof"><figure><figcaption>v3 · 近腿接触</figcaption><canvas id="proof-old-near" width="300" height="220"></canvas></figure><figure><figcaption>v3 · 远腿接触</figcaption><canvas id="proof-old-far" width="300" height="220"></canvas></figure><figure><figcaption>v4 · 近腿接触</figcaption><canvas id="proof-new-near" width="300" height="220"></canvas></figure><figure><figcaption>v4 · 远腿接触</figcaption><canvas id="proof-new-far" width="300" height="220"></canvas></figure></div><footer>拖动滑块自动暂停。时间参数仅用于本次美术审阅，不是正式攻速/伤害配置。GIF只包含本体帧，独立箭矢示意在本页显示。<div id="error" role="alert"></div></footer>
<script id="manifest" type="application/json">{"version": 4, "stage": "art-review-revision", "cellSize": 416, "anchorX": 208, "anchorY": 352, "clips": [{"name": "run", "source": "run-near-source.png", "columns": 2, "rows": 2, "output": "run-atlas.png", "gif": "run-preview.gif", "slowGif": "run-slow.gif", "scale": 0.36, "sourceScales": {"run-far-rebuilt.png": 0.338}, "baselineByRow": [606, 582], "frames": [{"sourceIndex": 0, "durationMs": 80}, {"sourceIndex": 1, "durationMs": 80}, {"sourceIndex": 2, "durationMs": 80}, {"sourceIndex": 3, "durationMs": 80}, {"source": "run-far-rebuilt.png", "sourceIndex": 0, "sourceBaseline": 603, "durationMs": 80}, {"source": "run-far-rebuilt.png", "sourceIndex": 2, "sourceBaseline": 590, "durationMs": 80}, {"source": "run-far-rebuilt.png", "sourceIndex": 3, "sourceBaseline": 590, "durationMs": 80}]}, {"name": "attack", "source": "attack-source-v2.png", "output": "attack-atlas.png", "gif": "attack-preview.gif", "slowGif": "attack-slow.gif", "columns": 4, "rows": 2, "scale": 0.48, "baselineByRow": [433, 432], "frames": [{"sourceIndex": 0, "durationMs": 100, "offsetX": -2.04}, {"sourceIndex": 1, "durationMs": 90, "offsetX": -1.08}, {"sourceIndex": 2, "durationMs": 80, "offsetX": -3.96}, {"sourceIndex": 3, "durationMs": 80, "offsetX": 9.96}, {"sourceIndex": 4, "durationMs": 120, "offsetX": 1.8}, {"sourceIndex": 5, "durationMs": 60, "trimLeft": 16, "offsetX": 1.56}, {"sourceIndex": 6, "durationMs": 90, "offsetX": 1.08}, {"sourceIndex": 7, "durationMs": 100, "offsetX": -2.52}], "stationaryFootCenters": [246.0, 244.0, 250.0, 221.0, 238.0, 238.5, 239.5, 247.0]}], "attackRelease": {"frameIndex": 5, "atMs": 470, "projectile": "separate-preview-only"}, "notes": ["User rejected v3 ornament continuity and high-knee passing pose.", "Redraw passing poses and move final ornament to trailing thigh per screenshot feedback.", "Art review draft; attack unchanged."]}</script>
<script>
const manifest=JSON.parse(document.getElementById('manifest').textContent);
const phases={run:['近腿接触','近腿下沉','近腿经过','近腿蹬离','远腿接触','远腿经过','远腿蹬离'],attack:['准备取箭','取箭','搭箭','半拉弦','充分拉弦','松弦 / 独立箭矢生成','随动','回收']};
const state={variant:"v4",playing:true,speed:1,zoom:1,elapsed:0,ready:false,frames:{run:0,attack:0},loops:{run:0,attack:0},error:null};
const manifests={v4:manifest,v3:{"version": 3, "stage": "art-review-revision", "cellSize": 416, "anchorX": 208, "anchorY": 352, "clips": [{"name": "run", "source": "run-near-source.png", "columns": 2, "rows": 2, "output": "run-atlas.png", "gif": "run-preview.gif", "slowGif": "run-slow.gif", "scale": 0.36, "sourceScales": {"run-far-rebuilt.png": 0.338}, "baselineByRow": [606, 582], "frames": [{"sourceIndex": 0, "durationMs": 80}, {"sourceIndex": 1, "durationMs": 80}, {"sourceIndex": 2, "durationMs": 80}, {"sourceIndex": 3, "durationMs": 80}, {"source": "run-far-rebuilt.png", "sourceIndex": 0, "sourceBaseline": 603, "durationMs": 80}, {"source": "run-far-rebuilt.png", "sourceIndex": 2, "sourceBaseline": 590, "durationMs": 80}, {"source": "run-far-rebuilt.png", "sourceIndex": 3, "sourceBaseline": 590, "durationMs": 80}]}, {"name": "attack", "source": "attack-source-v2.png", "output": "attack-atlas.png", "gif": "attack-preview.gif", "slowGif": "attack-slow.gif", "columns": 4, "rows": 2, "scale": 0.48, "baselineByRow": [433, 432], "frames": [{"sourceIndex": 0, "durationMs": 100, "offsetX": -2.04}, {"sourceIndex": 1, "durationMs": 90, "offsetX": -1.08}, {"sourceIndex": 2, "durationMs": 80, "offsetX": -3.96}, {"sourceIndex": 3, "durationMs": 80, "offsetX": 9.96}, {"sourceIndex": 4, "durationMs": 120, "offsetX": 1.8}, {"sourceIndex": 5, "durationMs": 60, "trimLeft": 16, "offsetX": 1.56}, {"sourceIndex": 6, "durationMs": 90, "offsetX": 1.08}, {"sourceIndex": 7, "durationMs": 100, "offsetX": -2.52}], "stationaryFootCenters": [246.0, 244.0, 250.0, 221.0, 238.0, 238.5, 239.5, 247.0]}], "attackRelease": {"frameIndex": 5, "atMs": 470, "projectile": "separate-preview-only"}, "notes": ["Lower rear-foot recovery; left anatomical thigh owns the single ornament in every pose.", "7 selected run keys; source cell 1 of far sheet remains excluded.", "Attack inherited unchanged from v2. High-resolution key art unchanged."]}};
const oldRunPhases=["近腿接触","近腿下沉","经过","近腿蹬离","远腿接触","远腿下沉","经过","远腿蹬离"];
const images={v4:{},v3:{}};let last;
const oldAsset=file=>location.protocol==='file:'?'../animation-v3/'+file:'/v3/'+file;
function locate(clip,time){const duration=clip.frames.reduce((s,f)=>s+f.durationMs,0);let t=((time%duration)+duration)%duration;for(let i=0;i<clip.frames.length;i++){if(t<clip.frames[i].durationMs)return {i,t,cycle:time%duration,duration};t-=clip.frames[i].durationMs;}return {i:0,t:0,cycle:0,duration};}
function render(clip,index,cycle=0){const c=document.getElementById(clip.name),ctx=c.getContext('2d');ctx.clearRect(0,0,416,416);ctx.imageSmoothingEnabled=false;ctx.save();ctx.translate(208,352);ctx.scale(state.zoom,state.zoom);ctx.translate(-208,-352);ctx.strokeStyle='#6c8374';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(12,353);ctx.lineTo(404,353);ctx.stroke();ctx.drawImage(images[state.variant][clip.name],index%4*416,Math.floor(index/4)*416,416,416,0,0,416,416);
if(clip.name==='attack'&&document.getElementById('arrow').checked&&cycle>=470&&cycle<650){const x=292+(cycle-470)*1.3,y=217;ctx.strokeStyle='#e5c78f';ctx.fillStyle='#e5c78f';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+28,y);ctx.stroke();ctx.beginPath();ctx.moveTo(x+32,y);ctx.lineTo(x+24,y-3);ctx.lineTo(x+24,y+3);ctx.closePath();ctx.fill();}
ctx.restore();state.frames[clip.name]=index;document.getElementById(clip.name+'-frame').max=clip.frames.length-1;document.getElementById(clip.name+'-frame').value=index;document.getElementById(clip.name+'-phase').textContent=`${index+1} / ${clip.frames.length} · ${phases[clip.name][index]} · ${clip.frames[index].durationMs}ms`;}
function drawProof(){for(const [id,version,index] of [['proof-old-near','v3',0],['proof-old-far','v3',4],['proof-new-near','v4',0],['proof-new-far','v4',4]]){const ctx=document.getElementById(id).getContext('2d');ctx.clearRect(0,0,300,220);ctx.imageSmoothingEnabled=false;ctx.drawImage(images[version].run,index%4*416+100,Math.floor(index/4)*416+210,240,160,0,10,300,200);}}
function redraw(){if(!state.ready)return;for(const clip of manifests[state.variant].clips){const pos=locate(clip,state.elapsed);state.loops[clip.name]=Math.floor(state.elapsed/pos.duration);render(clip,pos.i,pos.cycle);}}
function tick(now){if(last!==undefined&&state.playing)state.elapsed+=Math.min(now-last,100)*state.speed;last=now;redraw();requestAnimationFrame(tick);}
function setPlaying(value){state.playing=value;document.getElementById('play').textContent=value?'暂停':'播放';}
document.getElementById('variant').onchange=e=>{const focus=state.focus||'run',index=state.frames[focus];state.variant=e.target.value;const next=manifests[state.variant].clips.find(c=>c.name===focus);state.elapsed=next.frames.slice(0,Math.min(index,next.frames.length-1)).reduce((s,f)=>s+f.durationMs,0);for(const a of document.querySelectorAll('.links a')){const filename=a.getAttribute('href').split('/').pop();a.setAttribute('href',state.variant==='v3'?oldAsset(filename):filename);}redraw();};
document.getElementById('play').onclick=()=>setPlaying(!state.playing);document.getElementById('reset').onclick=()=>{state.elapsed=0;redraw();};document.getElementById('speed').onchange=e=>state.speed=Number(e.target.value);document.getElementById('zoom').onchange=e=>{state.zoom=Number(e.target.value);redraw();};document.getElementById('arrow').onchange=redraw;
for(const clip of manifest.clips)document.getElementById(clip.name+'-frame').oninput=e=>{setPlaying(false);state.focus=clip.name;const i=Number(e.target.value);const activeClip=manifests[state.variant].clips.find(c=>c.name===clip.name);state.elapsed=activeClip.frames.slice(0,i).reduce((s,f)=>s+f.durationMs,0);redraw();};
Promise.all(['v4','v3'].flatMap(variant=>manifest.clips.map(clip=>new Promise((resolve,reject)=>{const img=new Image;img.onload=()=>{if(img.width!==1664||img.height!==832)return reject(new Error('图集尺寸错误：'+variant+'/'+clip.name));images[variant][clip.name]=img;resolve();};img.onerror=()=>reject(new Error('图片加载失败：'+variant+'/'+clip.output));img.src=variant==='v3'?oldAsset(clip.output):clip.output;})))).then(()=>{state.ready=true;drawProof();requestAnimationFrame(tick);}).catch(error=>{state.error=String(error);document.getElementById('error').textContent=state.error;});
document.getElementById('contact-near').onclick=()=>window.hunterPreview.seek('run',0);document.getElementById('contact-far').onclick=()=>window.hunterPreview.seek('run',4);
window.hunterPreview={state,manifest,seek:(name,index)=>{setPlaying(false);state.focus=name;const clip=manifests[state.variant].clips.find(c=>c.name===name);state.elapsed=clip.frames.slice(0,index).reduce((s,f)=>s+f.durationMs,0);redraw();}};
</script></html>
