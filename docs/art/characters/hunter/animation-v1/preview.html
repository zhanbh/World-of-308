<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>女性猎人 · 跑动与普攻动画 v1</title>
<style>
:root{color-scheme:dark;font:15px/1.6 system-ui;background:#101719;color:#e5e9e1}*{box-sizing:border-box}body{max-width:1120px;margin:auto;padding:28px}h1{font-size:28px;margin:0 0 8px}h2{font-size:19px;margin:0}p{color:#acbdb8;margin:6px 0 18px}button,select,input{font:inherit}button,select{border:1px solid #4e685e;background:#203730;color:#e7eedf;border-radius:7px;padding:7px 13px}button{cursor:pointer}button:hover{background:#355448}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:22px 0}label{display:flex;align-items:center;gap:7px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px}article{background:#1a2325;border:1px solid #364846;border-radius:12px;overflow:hidden}header{padding:16px 20px 0}canvas{display:block;width:100%;height:auto;image-rendering:pixelated;background:repeating-conic-gradient(#192124 0% 25%,#1e282b 0% 50%) 0 0/24px 24px}.info{padding:14px 20px}.phase{font-variant-numeric:tabular-nums;color:#e6ca8e;min-height:28px}.frames{width:100%}a{color:#a6d7bb}footer{margin-top:22px;color:#9aafaa}.note{font-size:13px}.links{display:flex;gap:15px;flex-wrap:wrap}#error{color:#ffb9a9;white-space:pre-wrap}@media(max-width:720px){body{padding:18px}.cards{grid-template-columns:1fr}}
</style>
<h1>女性猎人 · 跑动 / 普攻 v1</h1><p>短战靴 · 黑丝袜 · 青绿轻甲。正常速度、慢放和逐帧检查；当前是美术动作草稿，尚未接入游戏。</p>
<div class="controls"><button id="play">暂停</button><button id="reset">从头播放</button><label>速度<select id="speed"><option value="1">1×</option><option value="0.5">0.5×</option><option value="0.25">0.25×</option></select></label><label>放大<select id="zoom"><option value="1">1×</option><option value="1.5">1.5×</option></select></label><label><input type="checkbox" id="arrow" checked>独立箭矢示意</label></div>
<div class="cards"><article><header><h2>跑动循环</h2><span class="note">两腿身份用上腿带区分，检查前后半循环。</span></header><canvas id="run" width="416" height="416"></canvas><div class="info"><div class="phase" id="run-phase"></div><input class="frames" id="run-frame" type="range" min="0" max="7" value="0" aria-label="跑动逐帧"><div class="links"><a href="run-preview.gif">正常 GIF</a><a href="run-slow.gif">慢放 GIF</a></div></div></article>
<article><header><h2>单箭普攻</h2><span class="note">箭矢在松弦阶段独立生成；此处不计算碰撞。</span></header><canvas id="attack" width="416" height="416"></canvas><div class="info"><div class="phase" id="attack-phase"></div><input class="frames" id="attack-frame" type="range" min="0" max="7" value="0" aria-label="普攻逐帧"><div class="links"><a href="attack-preview.gif">正常 GIF</a><a href="attack-slow.gif">慢放 GIF</a></div></div></article></div>
<footer>拖动滑块自动暂停。时间参数仅用于本次美术审阅，不是正式攻速/伤害配置。GIF只包含本体帧，独立箭矢示意在本页显示。<div id="error" role="alert"></div></footer>
<script id="manifest" type="application/json">{"version": 1, "stage": "animation-draft", "cellSize": 416, "anchorX": 208, "anchorY": 352, "clips": [{"name": "run", "source": "run-source-v3.png", "output": "run-atlas.png", "gif": "run-preview.gif", "slowGif": "run-slow.gif", "columns": 4, "rows": 2, "scale": 0.48, "baselineByRow": [427, 420], "frames": [{"sourceIndex": 0, "durationMs": 70}, {"sourceIndex": 1, "durationMs": 70}, {"sourceIndex": 2, "durationMs": 70}, {"sourceIndex": 3, "durationMs": 70}, {"sourceIndex": 4, "durationMs": 70}, {"sourceIndex": 5, "durationMs": 70, "trimLeft": 16, "offsetY": 2}, {"sourceIndex": 6, "durationMs": 70, "trimLeft": 16, "offsetY": 2}, {"sourceIndex": 7, "durationMs": 70}]}, {"name": "attack", "source": "attack-source-v1.png", "output": "attack-atlas.png", "gif": "attack-preview.gif", "slowGif": "attack-slow.gif", "columns": 4, "rows": 2, "scale": 0.48, "baselineByRow": [431, 430], "frames": [{"sourceIndex": 0, "durationMs": 100, "offsetX": -2.16}, {"sourceIndex": 1, "durationMs": 90, "offsetX": -0.96}, {"sourceIndex": 2, "durationMs": 80, "offsetX": -3.6}, {"sourceIndex": 3, "durationMs": 80, "offsetX": 9.84}, {"sourceIndex": 4, "durationMs": 120, "offsetX": 1.44}, {"sourceIndex": 5, "durationMs": 60, "trimLeft": 16, "offsetX": 1.2}, {"sourceIndex": 6, "durationMs": 90, "offsetX": 0.96}, {"sourceIndex": 7, "durationMs": 100, "offsetX": -2.4}], "stationaryFootCenters": [246.5, 244.0, 249.5, 221.5, 239.0, 239.5, 240.0, 247.0]}], "attackRelease": {"frameIndex": 5, "atMs": 470, "projectile": "separate-preview-only"}, "notes": ["Uniform scale per clip; no per-frame resizing or limb warps.", "Timings are art-review proposals, not game balance."]}</script>
<script>
const manifest=JSON.parse(document.getElementById('manifest').textContent);
const phases={run:['近腿接触','近腿下沉','经过','近腿蹬离','远腿接触','远腿下沉','经过','远腿蹬离'],attack:['准备取箭','取箭','搭箭','半拉弦','充分拉弦','松弦 / 独立箭矢生成','随动','回收']};
const state={playing:true,speed:1,zoom:1,elapsed:0,ready:false,frames:{run:0,attack:0},loops:{run:0,attack:0},error:null};
const images={};let last;
function locate(clip,time){const duration=clip.frames.reduce((s,f)=>s+f.durationMs,0);let t=((time%duration)+duration)%duration;for(let i=0;i<clip.frames.length;i++){if(t<clip.frames[i].durationMs)return {i,t,cycle:time%duration,duration};t-=clip.frames[i].durationMs;}return {i:0,t:0,cycle:0,duration};}
function render(clip,index,cycle=0){const c=document.getElementById(clip.name),ctx=c.getContext('2d');ctx.clearRect(0,0,416,416);ctx.imageSmoothingEnabled=false;ctx.save();ctx.translate(208,352);ctx.scale(state.zoom,state.zoom);ctx.translate(-208,-352);ctx.strokeStyle='#6c8374';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(12,353);ctx.lineTo(404,353);ctx.stroke();ctx.drawImage(images[clip.name],index%4*416,Math.floor(index/4)*416,416,416,0,0,416,416);
if(clip.name==='attack'&&document.getElementById('arrow').checked&&cycle>=470&&cycle<650){const x=292+(cycle-470)*1.3,y=217;ctx.strokeStyle='#e5c78f';ctx.fillStyle='#e5c78f';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+28,y);ctx.stroke();ctx.beginPath();ctx.moveTo(x+32,y);ctx.lineTo(x+24,y-3);ctx.lineTo(x+24,y+3);ctx.closePath();ctx.fill();}
ctx.restore();state.frames[clip.name]=index;document.getElementById(clip.name+'-frame').value=index;document.getElementById(clip.name+'-phase').textContent=`${index+1} / 8 · ${phases[clip.name][index]} · ${clip.frames[index].durationMs}ms`;}
function redraw(){if(!state.ready)return;for(const clip of manifest.clips){const pos=locate(clip,state.elapsed);state.loops[clip.name]=Math.floor(state.elapsed/pos.duration);render(clip,pos.i,pos.cycle);}}
function tick(now){if(last!==undefined&&state.playing)state.elapsed+=Math.min(now-last,100)*state.speed;last=now;redraw();requestAnimationFrame(tick);}
function setPlaying(value){state.playing=value;document.getElementById('play').textContent=value?'暂停':'播放';}
document.getElementById('play').onclick=()=>setPlaying(!state.playing);document.getElementById('reset').onclick=()=>{state.elapsed=0;redraw();};document.getElementById('speed').onchange=e=>state.speed=Number(e.target.value);document.getElementById('zoom').onchange=e=>{state.zoom=Number(e.target.value);redraw();};document.getElementById('arrow').onchange=redraw;
for(const clip of manifest.clips)document.getElementById(clip.name+'-frame').oninput=e=>{setPlaying(false);const i=Number(e.target.value);state.elapsed=clip.frames.slice(0,i).reduce((s,f)=>s+f.durationMs,0);redraw();};
Promise.all(manifest.clips.map(clip=>new Promise((resolve,reject)=>{const img=new Image;img.onload=()=>{if(img.width!==1664||img.height!==832)return reject(new Error('图集尺寸错误：'+clip.name));images[clip.name]=img;resolve();};img.onerror=()=>reject(new Error('图片加载失败：'+clip.output));img.src=clip.output;}))).then(()=>{state.ready=true;requestAnimationFrame(tick);}).catch(error=>{state.error=String(error);document.getElementById('error').textContent=state.error;});
window.hunterPreview={state,manifest,seek:(name,index)=>{setPlaying(false);const clip=manifest.clips.find(c=>c.name===name);state.elapsed=clip.frames.slice(0,index).reduce((s,f)=>s+f.durationMs,0);redraw();}};
</script></html>
